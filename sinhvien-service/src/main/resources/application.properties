spring.application.name=sinhvien-service
server.port=8081

# Ket noi CSDL MySQL (service nay chi lam viec voi bang SINHVIEN)
spring.datasource.url=jdbc:mysql://localhost:3306/qldatn_sinhvien?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Giu nguyen ten bang/cot viet HOA theo khai bao trong Entity @Table(name="SINHVIEN")
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.web.error.include-message=always

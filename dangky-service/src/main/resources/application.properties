spring.application.name=dangky-service
server.port=8083

# Ket noi CSDL MySQL (service nay chi lam viec voi bang DANGKY)
spring.datasource.url=jdbc:mysql://localhost:3306/qldatn_dangky?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.web.error.include-message=always

# Dia chi cac dich vu khac ma dangky-service goi toi qua HTTP/REST
service.sinhvien.url=http://localhost:8081/api/sinhvien
service.detai.url=http://localhost:8082/api/detai

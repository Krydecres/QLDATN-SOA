spring.application.name=dangky-service
server.port=8083

# Ket noi CSDL MySQL (service nay chi lam viec voi bang DANGKY)
spring.datasource.url=jdbc:mysql://localhost:3306/qldatn_dangky?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.web.error.include-message=always

# Dia chi cac dich vu khac ma dangky-service goi toi qua HTTP/REST
# 1. Đổi URL thành tên Service
service.sinhvien.url=http://AUTH-SERVICE/api/auth/sinhvien/internal
service.detai.url=http://DETAI-SERVICE/api/detai

# 2. Khai báo Discovery Registry nội bộ cho Spring Cloud LoadBalancer
spring.cloud.discovery.client.simple.instances.AUTH-SERVICE[0].uri=http://localhost:8081
spring.cloud.discovery.client.simple.instances.DETAI-SERVICE[0].uri=http://localhost:8082

# Duong dan OpenAPI spec qua Gateway cho dangky-service
springdoc.api-docs.path=/api/dangky/v3/api-docs
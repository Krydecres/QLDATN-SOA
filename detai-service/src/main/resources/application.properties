spring.application.name=detai-service
server.port=8082

# Ket noi CSDL MySQL (service nay chi lam viec voi bang DETAI)
spring.datasource.url=jdbc:mysql://localhost:3306/qldatn_detai?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.web.error.include-message=always

# Duong dan OpenAPI spec qua Gateway cho detai-service
springdoc.api-docs.path=/api/detai/v3/api-docs
service.dangky.url=http://localhost:8083/api/dangky/internal/check-detai
spring.application.name=auth-service
server.port=8081

# Ket noi CSDL MySQL (service nay chi lam viec voi bang TAIKHOAN)
spring.datasource.url=jdbc:mysql://localhost:3306/qldatn_auth?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Giu nguyen ten bang/cot theo khai bao trong Entity @Table(name="TAIKHOAN")
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.web.error.include-message=always

# Duong dan OpenAPI spec qua Gateway cho auth-service
springdoc.api-docs.path=/api/auth/v3/api-docs

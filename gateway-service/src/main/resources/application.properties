server.port=8080
spring.application.name=gateway-service

# -------------------------------------------------------------
# CHÍNH SÁCH 1: Quản lý CORS tập trung
# -------------------------------------------------------------
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# -------------------------------------------------------------
# CHÍNH SÁCH 2: Định tuyến request tới 3 service bên dưới
# -------------------------------------------------------------
# Route sang sinhvien-service (Port 8081)
spring.cloud.gateway.routes[0].id=sinhvien-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/sinhvien/**

# Route sang detai-service (Port 8082)
spring.cloud.gateway.routes[1].id=detai-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/detai/**

# Route sang dangky-service (Port 8083)
spring.cloud.gateway.routes[2].id=dangky-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/dangky/**
server.port=8080
spring.application.name=gateway-service

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Route 1: Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

# Route 2: De Tai Service
spring.cloud.gateway.routes[1].id=detai-service
spring.cloud.gateway.routes[1].uri=lb://DETAI-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/detai/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# Route 3: Dang Ky Service
spring.cloud.gateway.routes[2].id=dangky-service
spring.cloud.gateway.routes[2].uri=lb://DANGKY-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/dangky/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter


# Registry map tên Service với Instance thực tế
spring.cloud.discovery.client.simple.instances.AUTH-SERVICE[0].uri=http://localhost:8081
spring.cloud.discovery.client.simple.instances.DETAI-SERVICE[0].uri=http://localhost:8082
spring.cloud.discovery.client.simple.instances.DANGKY-SERVICE[0].uri=http://localhost:8083


# OpenAPI configuration
springdoc.swagger-ui.urls[0].name=1. Auth Service
springdoc.swagger-ui.urls[0].url=/api/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=2. De Tai Service
springdoc.swagger-ui.urls[1].url=/api/detai/v3/api-docs
springdoc.swagger-ui.urls[2].name=3. Dang Ky Service
springdoc.swagger-ui.urls[2].url=/api/dangky/v3/api-docs
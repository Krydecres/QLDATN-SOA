# =============================================================================
# 1. CAU HINH CO BAN CHO GATEWAY SERVICE
# =============================================================================
# Cong (port) ma API Gateway se lang nghe va tiep nhan moi request tu Client/Frontend
server.port=8080

# Ten dinh danh cua ung dung trong he thong Spring Boot / Spring Cloud
spring.application.name=gateway-service


# =============================================================================
# 2. CHINH SACH CORS (Cross-Origin Resource Sharing) TAP TRUNG
# =============================================================================
# Cau hinh CORS tap trung tai Gateway de cho phep cac ung dung Frontend (nhu Web Workstations,
# React, Angular, hoac file HTML tinh) co the goi API ma khong bi trinh duyet chan do loi SOP (Same-Origin Policy).

# Cho phep tat ca cac mien/nguon (Origins) truy cap vao bat ky duong dan nao (/**)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*

# Cho phep cac phuong thuc HTTP co ban duoc su dung khi goi API
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Cho phep truyen moi loai HTTP Header trong request (vd: Content-Type, Authorization, ...)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*


# =============================================================================
# 3. CHINH SACH DINH TRUYEN REQUEST (ROUTE CONFIGURATION)
# =============================================================================
# API Gateway đóng vai tro la "Cổng điều hướng trung tâm". Khi request gửi tới Gateway,
# no se dua vao đieu kien (Predicate) đe chuyển tiếp (Forward) request toi dung Service con.

# -----------------------------------------------------------------------------
# Route 1: Dinh truyen toi Sinh Vien Service (chay o port 8081)
# -----------------------------------------------------------------------------
# Mã ID duy nhat cho quy tac dinh truyen nay
spring.cloud.gateway.routes[0].id=auth-service
# Dia chi goc cua Microservice dich se nhan request
spring.cloud.gateway.routes[0].uri=http://localhost:8081
# Đieu kien: Moi request co duong dan bat dau bang /api/auth/ se duoc day sang port 8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# -----------------------------------------------------------------------------
# Route 2: Dinh truyen toi De Tai Service (chay o port 8082)
# -----------------------------------------------------------------------------
spring.cloud.gateway.routes[1].id=detai-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/detai/**

# -----------------------------------------------------------------------------
# Route 3: Dinh truyen toi Dang Ky Service (chay o port 8083)
# -----------------------------------------------------------------------------
spring.cloud.gateway.routes[2].id=dangky-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/dangky/**


# =============================================================================
# 4. GOM NHOM DULIEU OPENAPI (SWAGGER UI) TAI GATEWAY
# =============================================================================
# Cau hinh nay giup Swagger UI hien thi mot menu dropdown o goc tren ben phai trang web,
# cho phep nguoi dung chuyen doi va xem tai lieu API Docs cua tung Microservice con
# thong qua Gateway (port 8080) ma khong can mo tung port riêng lẻ.

# --- Service 1: Sinh Vien ---
# Ten hien thi trong danh sach dropdown cua Swagger UI
springdoc.swagger-ui.urls[0].name=1. Auth Service
# Duong dan de Gateway goi va lay file OpenAPI spec (JSON) cua auth-service.
# Request /api/auth/v3/api-docs se duoc Route 0 o tren chuyen toi http://localhost:8081/api/auth/v3/api-docs
springdoc.swagger-ui.urls[0].url=/api/auth/v3/api-docs

# --- Service 2: De Tai ---
springdoc.swagger-ui.urls[1].name=2. De Tai Service
springdoc.swagger-ui.urls[1].url=/api/detai/v3/api-docs

# --- Service 3: Dang Ky ---
springdoc.swagger-ui.urls[2].name=3. Dang Ky Service
springdoc.swagger-ui.urls[2].url=/api/dangky/v3/api-docs